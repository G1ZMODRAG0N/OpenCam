[package]
name = "OpenCam"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[profile.dev]
panic = "abort"

[dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", version = "0.13.0" }
fromsoftware-shared = { version = "0.13.0", git = "https://github.com/vswarte/fromsoftware-rs" }
ini = "1.3.0"
log = "0.4.29"
pelite = "0.10.0"
rand = "0.10.1"
retour = { git = "https://github.com/Hpmason/retour-rs", version = "0.4.0-alpha.4", features = [
    "static-detour",
] }
thiserror = "2.0.18"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }
